name: linting
on:
    workflow_call:
jobs:
    lining:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4

            - name: setup java
              uses: actions/setup-java@v4
              with:
                java-version: "21"
                distribution: "temurin"
                cache: "maven"
                

            - name: run checkstyle
              run: mvn checkstyle:check
              continue-on-error: true